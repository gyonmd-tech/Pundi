<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pundi</title>
    <!--
      Halaman lokal aplikasi native (server.errorPath di capacitor.config.ts):
      tampil bila situs Pundi gagal dimuat, mis. tanpa internet saat aplikasi
      dibuka. "Coba lagi" membuka alamat aplikasi (app-url.js, dibuat oleh
      scripts/mobile-app-url.mjs) — bukan memuat ulang halaman ini.
    -->
    <script src="app-url.js"></script>
    <style>
      :root {
        --paper: #F3F4F7; --surface: #FFFFFF; --ink: #0F1729; --muted: #556075;
        --brand: #2D4FE6; --brand-deep: #13237A; --lime: #C5F04A; --rule: #E3E6EE;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #0B0F1A; --surface: #1C2639; --ink: #EEF1F8; --muted: #9AA4B8; --rule: #252F45; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid; place-items: center;
        padding: max(24px, var(--safe-area-inset-top, env(safe-area-inset-top))) 20px max(24px, var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
        background:
          radial-gradient(40rem 22rem at 110% -10%, color-mix(in srgb, var(--lime) 14%, transparent), transparent 70%),
          var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%; max-width: 360px; padding: 32px 24px 24px; text-align: center;
        background: var(--surface); border: 1px solid var(--rule); border-radius: 24px;
        box-shadow: 0 1px 2px rgba(15, 23, 41, .04), 0 12px 32px rgba(15, 23, 41, .08);
        animation: rise 420ms cubic-bezier(.16, 1, .3, 1) both;
      }
      .logo { display: block; width: 64px; height: 64px; margin: 0 auto; }
      .status { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--brand); font-size: 12px; font-weight: 600; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
      h1 { margin: 14px 0 8px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 26px; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
      button {
        margin-top: 24px; width: 100%; min-height: 48px; border: 0; border-radius: 14px;
        background: var(--brand); color: #fff; font: inherit; font-weight: 600; font-size: 15px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 6px 16px color-mix(in srgb, var(--brand) 28%, transparent);
        transition: transform 140ms cubic-bezier(.16, 1, .3, 1);
      }
      button:active { transform: scale(.97); }
      button[disabled] { opacity: .6; }
      .hint { margin-top: 12px; font-size: 12px; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { main, .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="pundi-symbol.svg" alt="Pundi" width="64" height="64" />
      <span class="status" id="status"><span class="dot"></span><span id="status-text">Menunggu koneksi</span></span>
      <h1>Tidak dapat terhubung</h1>
      <p>Pundi butuh internet untuk memuat data keuanganmu. Periksa Wi‑Fi atau data seluler — kami akan mencoba lagi otomatis saat koneksi kembali.</p>
      <button type="button" id="retry">Coba lagi</button>
      <p class="hint" id="hint" hidden>Masih belum tersambung. Coba lagi sebentar lagi.</p>
    </main>
    <script>
      (function () {
        var target = window.PUNDI_APP_URL || "https://pundi-theta.vercel.app/?source=app";
        var cap = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor : null;
        var plugins = (cap && cap.Plugins) || {};
        function call(name, method, options) {
          try { var p = plugins[name]; if (p && p[method]) p[method](options); } catch (e) {}
        }
        call("SplashScreen", "hide", { fadeOutDuration: 250 });
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        call("SystemBars", "setStyle", { style: dark ? "DARK" : "LIGHT" });
        // Tombol back Android di halaman ini: minimalkan, jangan keluar paksa.
        try { if (plugins.App && plugins.App.addListener) plugins.App.addListener("backButton", function () { call("App", "minimizeApp"); }); } catch (e) {}

        var button = document.getElementById("retry");
        var hint = document.getElementById("hint");
        var statusText = document.getElementById("status-text");
        function retry() {
          if (navigator.onLine === false) {
            hint.hidden = false;
            return;
          }
          button.disabled = true;
          button.textContent = "Menghubungkan…";
          statusText.textContent = "Menghubungkan";
          window.location.replace(target);
          // Bila halaman tetap di sini (masih gagal), pulihkan tombol.
          setTimeout(function () { button.disabled = false; button.textContent = "Coba lagi"; statusText.textContent = "Menunggu koneksi"; hint.hidden = false; }, 8000);
        }
        button.addEventListener("click", retry);
        window.addEventListener("online", retry);
      })();
    </script>
  </body>
</html>
